UENV_EXPECT_SYS="linux/fedora"
UENV_EXPECT_USR="uenv"

UENV_SYS_TMP DEFAULT=/tmp

UENV_USR_ADHOC DEFAULT=@{HOME}/.sys/adhoc
UENV_USR_CACHE DEFAULT=@{HOME}/.sys/cache
UENV_USR_CONFIG DEFAULT=@{HOME}/.config
UENV_USR_DATA DEFAULT=@{HOME}/.sys/data
UENV_USR_LOCAL DEFAULT=@{HOME}/.sys/local
UENV_USR_MNT DEFAULT=@{HOME}/.sys/mnt
UENV_USR_OF DEFAULT=@{HOME}/.sys/of
UENV_USR_SECRET DEFAULT=@{HOME}/.sys/secret
UENV_USR_SRV DEFAULT=@{HOME}/.sys/srv
UENV_USR_STATE DEFAULT=@{HOME}/.sys/state
UENV_USR_TMP DEFAULT=@{HOME}/tmp OVERRIDE=${TMPDIR}

XDG_CACHE_HOME DEFAULT=@{HOME}/.cache OVERRIDE=${UENV_USR_CACHE}
XDG_CONFIG_HOME DEFAULT=@{HOME}/.config OVERRIDE=${UENV_USR_CONFIG}
XDG_DATA_HOME DEFAULT=@{HOME}/.local/share OVERRIDE=${UENV_USR_DATA}
XDG_STATE_HOME DEFAULT=@{HOME}/.local/state OVERRIDE=${UENV_USR_STATE}

TMPDIR DEFAULT=${UENV_USR_TMP} OVERRIDE=${TMPDIR}
XDG_BIN_HOME DEFAULT=${UENV_USR_LOCAL}/bin

